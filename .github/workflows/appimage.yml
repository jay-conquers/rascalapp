name: AppImage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: typecheck and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the bot and relay images
        run: |
          docker build --file packages/bot/Dockerfile --tag rascal-bot:ci .
          docker build --file packages/relay/Dockerfile --tag rascal-relay:ci .

  appimage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build AppImage
        run: ./scripts/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Rascal-AppImage
          path: release/Rascal-*.AppImage
          if-no-files-found: error

  windows:
    name: Windows NSIS
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Package unsigned NSIS
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Rascal-Windows-NSIS
          path: release/Rascal-*-win-*.exe
          if-no-files-found: error

  macos:
    name: macOS DMG
    runs-on: macos-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Package unsigned DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:mac
      - uses: actions/upload-artifact@v4
        with:
          name: Rascal-macOS-DMG
          path: release/Rascal-*-mac-*.dmg
          if-no-files-found: error
