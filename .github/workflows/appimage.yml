name: AppImage

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: typecheck and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the bot image
        run: docker build --file packages/bot/Dockerfile --tag rascal-bot:ci .

  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build AppImage
        run: ./scripts/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Rascal-AppImage
          path: release/Rascal-*.AppImage
          if-no-files-found: error
