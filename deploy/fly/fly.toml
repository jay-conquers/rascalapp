# Run fly commands from the repository root:
#   fly deploy --config deploy/fly/fly.toml
# Change `app` to a name that is free on Fly. App names are global.

# If "rascal" is already taken on Fly, use rascalapp instead and say so in the docs.
app = "rascal"
primary_region = "iad"

[build]
  dockerfile = "packages/bot/Dockerfile"

[env]
  RASCAL_BOT_BIND = "0.0.0.0"
  RASCAL_BOT_PORT = "4788"
  RASCAL_BOT_DIR = "/data"

[http_service]
  internal_port = 4788
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    timeout = "3s"
    path = "/healthz"

[[mounts]]
  source = "rascal_bot_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
